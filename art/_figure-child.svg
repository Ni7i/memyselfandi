<svg viewBox="0 0 400 420">
  <!-- Enis at three, standing, about 4.9 heads (unit 64). Ground 400. Profile facing left.
       Knitted jumper with one stripe, corduroy trousers, small sneakers with a strap.
       He looks down at a computer mouse held in both hands; its red cable falls to the floor,
       curls round his feet and runs off along the ground. -->
  <g id="guides">
    <path class="guide" d="M100,88 H300 M100,152 H300 M100,216 H300 M100,280 H300 M100,344 H300 M100,400 H300"/>
  </g>

  <g id="legs">
    <!-- far leg behind -->
    <path class="fill" data-tone="paper" d="M206,262 L230,264 C230,300 230,340 232,382 L210,382 Z"/>
    <path class="ink" data-w="2" d="M230,264 C230,300 229,340 232,382"/>
    <!-- near leg: soft corduroy, a little bend at the knee -->
    <path class="fill" data-tone="paper" d="M176,258 C173,282 175,304 180,322 C182,342 185,362 187,382 L217,382 C215,362 215,342 217,324 C220,304 221,282 220,262 Z"/>
    <path class="ink" data-w="1.4" d="M176,260 C173,282 175,304 180,322 C182,342 185,362 187,380"/>
    <path class="ink" data-w="1.9" d="M220,264 C221,282 220,304 217,324 C215,342 215,362 217,382"/>
    <path class="fine" data-w="0.5" d="M190,268 C188,300 192,340 196,376 M198,266 C197,300 200,340 202,376 M206,266 C206,300 207,340 208,376"/>
    <path class="fine" data-w="0.8" d="M182,322 C190,327 202,328 214,324 M184,330 C192,334 202,334 212,331"/>
    <path class="hatch" data-angle="66" data-gap="3.6" data-w="0.42" d="M216,266 L230,266 C230,300 230,340 231,378 L214,378 C212,350 212,320 214,300 C215,290 216,278 216,266 Z"/>
    <!-- far shoe, heel showing -->
    <path class="fill" data-tone="paper" d="M212,382 L234,382 C238,388 239,394 238,400 L212,400 Z"/>
    <path class="ink" data-w="1.5" d="M234,382 C238,388 239,394 238,400"/>
    <path class="ink" data-w="2" data-taper="0.05 0.15" d="M212,401 L239,401"/>
    <!-- near shoe: round toe, a strap across -->
    <path class="fill" data-tone="paper" d="M190,382 L214,382 C217,388 218,394 217,399 L166,399 C160,399 159,393 164,390 C172,386 182,384 190,382 Z"/>
    <path class="ink" data-w="1.5" d="M214,382 C217,388 218,394 217,399"/>
    <path class="ink" data-w="1.4" d="M190,383 C180,384 170,386 164,390 C159,393 160,399 166,399"/>
    <path class="ink" data-w="2.2" data-taper="0.05 0.12" d="M164,401 L218,401"/>
    <path class="fine" data-w="0.9" d="M186,386 C192,385 200,386 206,389"/>
    <path class="fine" data-w="0.8" d="M163,396 L217,396"/>
    <path class="fill" data-tone="shade" d="M148,398 C180,393 236,393 258,400 C236,406 180,406 148,402 Z"/>
  </g>

  <g id="jumper">
    <!-- a round little body: chest, belly, ribbed hem -->
    <path class="fill" data-tone="paper" d="M186,168 C178,176 172,188 170,202 C165,220 164,238 170,252 C173,258 175,261 178,264 L230,266 C232,252 234,236 234,220 C234,200 230,184 222,172 C212,164 196,162 186,168 Z"/>
    <path class="ink" data-w="1.4" d="M186,170 C178,178 172,190 170,204 C165,222 164,240 170,254 C173,259 175,262 178,264"/>
    <path class="ink" data-w="2.4" d="M222,172 C230,184 234,200 234,220 C234,238 232,252 230,266"/>
    <!-- ribbed hem -->
    <path class="ink" data-w="1.3" d="M176,256 C194,258 212,259 232,258"/>
    <path class="ink" data-w="1.4" d="M178,264 C196,266 214,267 230,266"/>
    <path class="fine" data-w="0.5" d="M182,257 L182,264 M188,257.5 L188,265 M194,258 L194,265.5 M200,258 L200,266 M206,258 L206,266 M212,258 L212,266 M218,258 L218,266 M224,258 L224,266"/>
    <!-- one stripe across the chest -->
    <path class="fine" data-w="0.9" d="M172,196 C190,193 212,193 232,196 M171,206 C190,203 212,203 233,206"/>
    <path class="hatch" data-angle="80" data-gap="2.6" data-w="0.4" d="M172,197 C190,194 212,194 232,197 L233,205 C212,202 190,202 171,205 Z"/>
    <path class="hatch" data-angle="66" data-gap="3.4" data-w="0.42" d="M224,176 C230,188 233,204 233,222 C232,238 230,250 229,260 C226,246 224,230 224,214 C224,200 224,188 224,176 Z"/>
  </g>

  <g data-include="_head-child" transform="rotate(-16 200 176) translate(143.2,79.5) scale(0.344)"/>

  <g id="collar">
    <!-- ribbed neckline over the bottom of the neck -->
    <path class="fill" data-tone="paper" d="M182,166 C194,170 208,168 220,162 L224,174 C210,180 196,182 180,178 Z"/>
    <path class="ink" data-w="1.3" d="M184,167 C194,171 206,169 218,163"/>
    <path class="ink" data-w="1.2" d="M182,176 C196,180 210,178 222,172"/>
  </g>

  <g id="arm">
    <!-- short near arm: elbow at the side, forearm raised, both hands round the mouse -->
    <path class="fill" data-tone="paper" d="M210,176 C220,180 226,192 226,206 C226,216 224,222 220,226 C212,226 202,222 194,218 L190,202 C196,204 200,206 204,206 C204,196 204,186 210,176 Z"/>
    <path class="ink" data-w="2.1" d="M212,177 C221,182 226,194 226,206 C226,216 224,222 220,226"/>
    <path class="ink" data-w="1.7" d="M220,226 C212,226 202,222 194,218"/>
    <path class="ink" data-w="1.2" d="M205,190 C204,196 204,202 204,206 C200,206 195,204 190,202"/>
    <path class="fine" data-w="0.8" d="M206,208 C212,212 218,212 222,208"/>
    <!-- ribbed cuff -->
    <path class="ink" data-w="1.2" d="M190,202 C186,207 187,214 194,218"/>
    <path class="ink" data-w="1" d="M185,203 C182,207 183,213 188,216"/>
  </g>

  <g id="mouse">
    <!-- a computer mouse of the early 2010s: a low rounded hump, two buttons -->
    <path class="fill" data-tone="paper" d="M150,212 C150,202 158,196 168,196 C176,196 182,200 183,208 L183,214 C172,216 160,216 150,214 Z"/>
    <path class="ink" data-w="1.5" d="M150,213 C150,202 158,196 168,196 C176,196 182,200 183,208 L183,214"/>
    <path class="ink" data-w="1.2" d="M150,214 C160,216 172,216 183,214"/>
    <path class="fine" data-w="0.7" d="M152,206 C156,204 160,203 164,203"/>
    <path class="hatch" data-angle="70" data-gap="2.4" data-w="0.38" d="M150,210 C162,212 174,212 183,210 L183,214 C172,216 160,216 150,214 Z"/>
  </g>

  <g id="hands">
    <!-- near hand holding the mouse from behind and below: small, soft knuckles -->
    <path class="fill" data-tone="paper" d="M188,204 C182,200 176,198 172,198 C168,198 166,201 168,203 C172,204 176,206 178,208 C174,210 172,214 174,217 C178,220 184,220 190,216 Z"/>
    <path class="ink" data-w="1.3" d="M188,204 C182,200 176,198 172,198 C168,198 166,201 168,203 C172,204 176,206 178,208"/>
    <path class="ink" data-w="1.2" d="M178,208 C174,210 172,214 174,217 C178,220 184,220 190,216"/>
    <path class="fine" data-w="0.6" d="M176,214 C178,215 180,215 182,214"/>
    <!-- far hand: fingertips over the front of the mouse -->
    <path class="fine" data-w="1" d="M156,200 C153,201 151,203 152,205 M161,198 C158,199 156,201 157,203"/>
  </g>

  <g id="thread">
    <!-- the mouse cable: out of the front, down to the floor, a curl round his feet, then away -->
    <path class="thread" data-w="1.6" d="M150,210 C140,212 136,224 138,250 C140,290 146,340 150,378 C152,394 162,404 182,406 C206,408 232,404 244,398 C252,392 248,384 238,386 C226,390 232,402 252,406 C290,412 330,410 400,408"/>
  </g>
</svg>
