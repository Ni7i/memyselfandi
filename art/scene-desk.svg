<svg viewBox="0 0 1300 900">
  <!-- Scene 3, age three. The thought opens into a room: a wooden desk seen from the front,
       a family computer of the early 2010s (flat screen, keyboard, tower under the desk),
       a desk lamp. Enis stands on a step stool at the end of the desk, both hands round the mouse.
       His father's arm comes down from above the frame, his hand resting on the boy's back.
       The mouse cable is the thread: over the edge of the desk, one loop, into the tower.
       Floor 880. Desk top front edge 433. Child at 1.9 (unit 64 x 1.9). -->

