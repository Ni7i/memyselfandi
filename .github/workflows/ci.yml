name: CI

on:
  push:
    branches: [main, claude/eager-fermi-TDqRf]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: test
    if: failure()
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '❌ HP Garage – CI Tests fehlgeschlagen (Branch: ${{ github.ref_name }})'
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: 'HP Garage CI <${{ secrets.MAIL_USERNAME }}>'
          body: |
            Die automatischen Tests für die HP Garage Website sind fehlgeschlagen.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}

            Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
