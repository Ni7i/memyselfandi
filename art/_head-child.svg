    <path class="fine" data-w="1.2" d="M116,234 C134,232 150,224 160,213 C164,208 167,204 169,198"/>
    <path class="ink" data-tone="paper" data-w="1.1" data-taper="0.3 0.3" d="M101,115 C94,124 90,133 89,141 C88,150 89,157 91,163 C92,166 95,169 96,172"/>
