<svg viewBox="0 0 300 340">
  <!-- Enis at three. Toddler proportions: the skull is most of the head, the forehead bulges,
       the face sits low and small: a short soft nose, a round cheek that shows past the mouth,
       a tiny receding chin, a short neck. Same shadowed face, same ear, the first curl. -->
  <g id="shadow">
    <path class="fill" data-tone="face" d="M100,108 C114,106 128,108 140,114 C150,124 158,140 165,160 C169,156 174,154 181,154 C190,155 196,163 196,174 C208,182 216,192 222,204 C218,206 214,207 210,208 C206,232 206,258 208,282 L120,282 C119,266 118,250 116,234 C110,234 104,232 100,228 C97,225 96,222 96,218 C96,215 94,213 93,211 C92,209 93,207 95,205 C93,203 92,201 92,199 C92,197 90,196 87,195 C83,194 81,191 83,187 C86,182 90,177 93,173 C92,170 89,168 88,164 C86,156 85,148 86,140 C87,128 92,116 100,108 Z"/>
    <path class="fill" data-tone="face" d="M112,232 C132,230 150,222 160,212 C164,208 167,204 169,199 C173,208 172,220 166,228 C156,240 138,246 117,248 C117,243 116,238 116,234 Z"/>
  </g>

  <g id="hair">
    <path class="fill" data-tone="dark" d="M98,112 C96,84 114,58 148,48 C190,38 238,54 258,90 C270,114 270,146 260,170 C252,186 240,198 222,205 C216,192 208,182 196,174 C196,163 190,155 181,154 C174,154 169,156 165,160 C160,144 152,128 140,116 C128,108 112,107 98,112 Z"/>
