<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <radialGradient id="bg" cx="45%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#162440"/>
      <stop offset="60%" stop-color="#0a1228"/>
      <stop offset="100%" stop-color="#04070f"/>
    </radialGradient>
    <radialGradient id="glow" cx="48%" cy="42%" r="52%">
      <stop offset="0%" stop-color="rgba(80,120,220,0.16)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <rect width="600" height="450" fill="url(#glow)"/>
  <!-- mihrab arch -->
  <path d="M 220 380 L 220 220 Q 220 100 300 100 Q 380 100 380 220 L 380 380 Z"
        fill="none" stroke="rgba(120,160,255,0.18)" stroke-width="1.2"/>
  <path d="M 240 380 L 240 228 Q 240 128 300 128 Q 360 128 360 228 L 360 380 Z"
        fill="none" stroke="rgba(120,160,255,0.14)" stroke-width="0.9"/>
  <path d="M 260 380 L 260 236 Q 260 156 300 156 Q 340 156 340 236 L 340 380 Z"
        fill="none" stroke="rgba(120,160,255,0.11)" stroke-width="0.7"/>
  <!-- outer arches suggesting mosque -->
  <path d="M 100 380 L 100 270 Q 100 150 200 150" fill="none" stroke="rgba(120,160,255,0.07)" stroke-width="0.8"/>
  <path d="M 500 380 L 500 270 Q 500 150 400 150" fill="none" stroke="rgba(120,160,255,0.07)" stroke-width="0.8"/>
  <!-- horizon line -->
  <line x1="60" y1="380" x2="540" y2="380" stroke="rgba(120,160,255,0.12)" stroke-width="0.7"/>
  <!-- stars -->
  <circle cx="180" cy="80"  r="1.2" fill="rgba(200,220,255,0.5)"/>
  <circle cx="420" cy="60"  r="1.5" fill="rgba(200,220,255,0.6)"/>
  <circle cx="500" cy="110" r="1"   fill="rgba(200,220,255,0.4)"/>
  <circle cx="110" cy="130" r="1.2" fill="rgba(200,220,255,0.45)"/>
  <circle cx="460" cy="170" r="0.8" fill="rgba(200,220,255,0.35)"/>
  <circle cx="150" cy="200" r="1"   fill="rgba(200,220,255,0.3)"/>
  <!-- crescent -->
  <path d="M 300 52 Q 320 42 330 60 Q 310 58 300 72 Q 288 58 268 60 Q 278 42 300 52 Z"
        fill="rgba(180,210,255,0.35)"/>
  <!-- center glow -->
  <circle cx="300" cy="225" r="3.5" fill="rgba(140,180,255,0.55)"/>
</svg>
