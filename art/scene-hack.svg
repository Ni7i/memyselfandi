<svg viewBox="0 0 1300 900">
  <!-- Baden hackt, BBB Baden. A long table in a hall at night, a laptop open in front of Enis,
       a wall of sticky notes behind, a bunting line overhead (its lettering is set on the page),
       a can, a cup, a pad of notes. The laptop's cable is the thread. Floor 860. Figure at 1.3. -->
  <g id="hall" data-window="0 0.3">
    <path class="fine" data-tone="far" data-w="0.9" d="M0,760 L1300,760"/>
    <!-- bunting: a sagging string, little flags -->
    <path class="fine" data-tone="mid" data-w="0.9" d="M40,96 C300,150 700,150 1000,110"/>
    <path class="fine" data-tone="mid" data-w="0.8" d="M90,108 L104,140 L118,114 M210,128 L222,160 L236,133 M330,140 L340,172 L354,143 M450,146 L458,178 L472,147 M570,147 L576,179 L590,146 M690,143 L694,175 L708,141 M810,134 L812,166 L826,131 M930,120 L930,152 L944,117"/>
    <!-- a paper sign taped to the wall; its words are set on the page -->
    <path class="fill" data-tone="paper" d="M500,196 L820,190 L824,262 L502,268 Z"/>
    <path class="ink" data-tone="mid" data-w="1.3" d="M500,196 L820,190 L824,262 L502,268 Z"/>
    <path class="fine" data-tone="far" data-w="1.2" d="M520,188 L540,204 M800,182 L812,200"/>
