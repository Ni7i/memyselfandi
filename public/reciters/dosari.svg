<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <radialGradient id="bg" cx="55%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#4a1820"/>
      <stop offset="55%" stop-color="#22080e"/>
      <stop offset="100%" stop-color="#080204"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="rgba(200,80,80,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <rect width="600" height="450" fill="url(#glow)"/>
  <!-- overlapping circles (Islamic coin pattern) -->
  <circle cx="300" cy="225" r="130" fill="none" stroke="rgba(220,120,100,0.12)" stroke-width="1"/>
  <circle cx="300" cy="225" r="90"  fill="none" stroke="rgba(220,120,100,0.16)" stroke-width="0.9"/>
  <circle cx="300" cy="225" r="55"  fill="none" stroke="rgba(220,120,100,0.2)"  stroke-width="0.8"/>
  <!-- 6 satellite circles at 60° -->
  <circle cx="430" cy="225" r="130" fill="none" stroke="rgba(220,120,100,0.07)" stroke-width="0.7"/>
  <circle cx="170" cy="225" r="130" fill="none" stroke="rgba(220,120,100,0.07)" stroke-width="0.7"/>
  <circle cx="365" cy="112" r="130" fill="none" stroke="rgba(220,120,100,0.07)" stroke-width="0.7"/>
  <circle cx="235" cy="112" r="130" fill="none" stroke="rgba(220,120,100,0.07)" stroke-width="0.7"/>
  <circle cx="365" cy="338" r="130" fill="none" stroke="rgba(220,120,100,0.07)" stroke-width="0.7"/>
  <circle cx="235" cy="338" r="130" fill="none" stroke="rgba(220,120,100,0.07)" stroke-width="0.7"/>
  <!-- outer frame -->
  <circle cx="300" cy="225" r="190" fill="none" stroke="rgba(220,120,100,0.06)" stroke-width="1"/>
  <!-- center -->
  <circle cx="300" cy="225" r="4" fill="rgba(240,140,110,0.55)"/>
</svg>
