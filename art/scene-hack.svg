    <path class="fine" data-tone="far" data-w="0.8" d="M150,260 L196,260 L196,306 L150,306 Z M210,252 L256,252 L256,298 L210,298 Z M270,266 L316,266 L316,312 L270,312 Z M160,330 L206,330 L206,376 L160,376 Z M226,322 L272,322 L272,368 L226,368 Z M300,336 L346,336 L346,382 L300,382 Z M380,262 L426,262 L426,308 L380,308 Z M392,334 L438,334 L438,380 L392,380 Z"/>
    <path class="fine" data-tone="far" data-w="0.5" d="M158,276 L186,276 M158,286 L180,286 M218,268 L246,268 M278,282 L306,282 M168,346 L194,346 M234,338 L262,338 M308,352 L336,352 M388,278 L416,278 M400,350 L428,350"/>
    <path class="hatch" data-tone="far" data-angle="70" data-gap="4" data-w="0.3" d="M210,252 L256,252 L256,298 L210,298 Z M300,336 L346,336 L346,382 L300,382 Z"/>
    <!-- a whiteboard behind him with a sketch of boxes and arrows -->
    <path class="ink" data-tone="mid" data-w="1.3" d="M1000,190 L1260,190 L1260,420 L1000,420 Z"/>
    <path class="fine" data-tone="far" data-w="0.8" d="M1030,230 L1090,230 L1090,270 L1030,270 Z M1150,230 L1220,230 L1220,270 L1150,270 Z M1090,250 L1146,250 M1138,244 L1148,250 L1138,256 M1060,270 L1060,330 L1180,330 L1180,270 M1100,360 L1220,360 M1100,380 L1190,380"/>
  </g>

  <g id="chair" data-window="0.12 0.42">
    <!-- a stacking chair -->
    <path class="fill" data-tone="paper" d="M900,664 L1016,664 L1016,678 L900,678 Z"/>
    <path class="ink" data-w="1.8" d="M900,664 L1016,664"/>
    <path class="ink" data-w="1.4" d="M900,678 L1016,678 M900,664 L900,678"/>
    <path class="ink" data-w="1.6" d="M1004,664 L1014,480 M1018,664 L1028,480"/>
    <path class="fill" data-tone="paper" d="M996,484 L1040,478 L1036,570 L994,574 Z"/>
    <path class="ink" data-w="1.5" d="M996,484 L1040,478 L1036,570 L994,574 Z"/>
    <path class="ink" data-w="1.6" d="M914,678 L896,860 M1006,678 L1024,860"/>
  </g>

  <g id="enis" data-include="_figure-teen-seated" transform="translate(560,80) scale(1.3)" data-window="0.24 0.8"/>

  <g id="table" data-window="0.06 0.4">
