    <path class="fill" data-tone="paper" d="M0,548 L826,548 L834,561 L834,572 L0,572 Z"/>
    <path class="ink" data-w="1.3" d="M0,548 L826,548"/>
    <path class="ink" data-w="2" d="M0,561 L834,561"/>
    <path class="ink" data-w="1.5" d="M0,572 L834,572 M826,548 L834,561 L834,572"/>
    <path class="hatch" data-angle="84" data-gap="4" data-w="0.4" d="M0,561 L834,561 L834,572 L0,572 Z"/>
