    <path class="hatch" data-angle="80" data-gap="3" data-w="0.4" d="M456,500 L466,500 L466,546 L456,546 Z"/>
    <path class="fill" data-tone="paper" d="M498,512 L530,512 L526,548 L502,548 Z"/>
    <path class="ink" data-w="1.4" d="M498,512 L530,512 L526,548 L502,548 Z M530,520 C540,520 542,534 528,536"/>
    <path class="fill" data-tone="paper" d="M330,544 L410,541 L418,548 L326,549 Z"/>
    <path class="ink" data-w="1.1" d="M330,544 L410,541 L418,548 L326,549 Z"/>
  </g>

  <g id="laptop" data-window="0.2 0.5">
    <!-- the laptop: keyboard deck under his hands, the lid up and turned a little toward us,
         lines of code on the screen -->
    <path class="fill" data-tone="paper" d="M600,540 L800,536 L806,546 L594,549 Z"/>
    <path class="ink" data-w="1.4" d="M600,540 L800,536 L806,546 L594,549 Z"/>
    <path class="fine" data-w="0.6" d="M620,541 L780,538 M616,544 L786,541.5"/>
    <path class="fill" data-tone="dark" d="M600,540 L566,402 L574,398 L608,538 Z"/>
    <path class="fill" data-tone="glow" d="M576,402 L700,384 L728,520 L608,538 Z"/>
    <path class="ink" data-w="1.6" d="M574,398 L700,380 L730,522 L608,540 Z"/>
    <path class="ink" data-w="1.1" d="M582,406 L698,390 L722,514 L612,530 Z"/>
    <path class="fine" data-w="0.7" d="M596,420 L640,414 M600,434 L668,425 M612,448 L660,442 M612,462 L690,452 M604,476 L652,470 M616,490 L700,480 M608,504 L664,498"/>
  </g>

  <g id="thread" data-window="0.86 1">
    <!-- the laptop's cable: out of its side, over the edge of the table, down to the floor -->
    <path class="thread" data-w="1.9" d="M598,546 C586,548 576,552 572,560 C566,580 560,620 552,660 C546,690 540,720 520,740 C506,754 492,752 494,740 C496,728 512,730 516,742 C522,764 520,800 512,860"/>
