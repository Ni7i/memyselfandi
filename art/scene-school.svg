    <path class="ink" data-tone="mid" data-w="1.2" d="M1140,428 L1300,428 M1140,436 L1300,436"/>
    <path class="fine" data-tone="far" data-w="0.8" d="M1180,200 C1200,196 1230,198 1260,194 M1182,232 C1210,228 1240,232 1290,226 M1186,270 L1226,268"/>
