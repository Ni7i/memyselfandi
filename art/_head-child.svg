    <path class="ink" data-tone="paper" data-w="0.9" data-taper="0.3 0.3" d="M172,160 C181,159 187,165 188,174"/>
  </g>

  <g id="neck">
    <path class="ink" data-w="2.1" d="M260,170 C252,186 240,198 222,205 C218,206 214,207 210,208"/>
    <path class="ink" data-w="1.9" d="M116,234 C118,250 119,266 120,282"/>
    <path class="ink" data-w="2" d="M210,208 C206,232 206,258 208,282"/>
  </g>
</svg>
