<svg viewBox="0 0 1600 900">
  <!-- Scene 1: Enis on the bench by the Limmat. The setting draws first and lightly,
       then the bench and the young man, then the red thread drops from the top of the page
       into his hand, loops over his knee and runs away along the ground. -->
  <g id="setting" data-include="_baden" data-window="0 0.42"/>
  <!-- the plane tree stands apart from the setting: the setting fades once the reader scrolls,
       the tree stays with him and moves in the same wind as his hair -->
  <g id="tree" data-include="_tree" data-window="0.1 0.5"/>
  <g id="enis" data-include="_figure-seated" transform="translate(800,323) scale(0.78)" data-window="0.12 0.84"/>
