    <path class="ink" data-tone="dark" data-w="2.4" data-taper="0.1 0.9" d="M150,48 C156,38 166,34 174,36"/>
    <path class="ink" data-tone="dark" data-w="2" data-taper="0.1 0.9" d="M166,44 C174,38 184,38 190,42"/>
    <path class="ink" data-tone="dark" data-w="2.2" data-taper="0.1 0.9" d="M240,190 C244,198 244,206 240,212"/>
    <path class="ink" data-tone="paper" data-w="0.9" d="M122,78 C144,66 172,62 198,66"/>
    <path class="ink" data-tone="paper" data-w="0.8" d="M218,104 C232,116 242,134 244,154"/>
    <!-- the first curl: soft, two strands and a wisp -->
    <path class="ink" data-w="3.2" data-taper="0.03 0.75" d="M110,110 C102,112 97,118 96,125 C95,132 99,137 104,136 C108,135.5 109,131 106,128.5 C104,127 102,128 102,130"/>
    <path class="ink" data-w="2" data-taper="0.04 0.8" d="M114,111 C108,114 103,118 101,124"/>
    <path class="ink" data-w="0.8" data-taper="0.1 0.9" d="M108,112 C104,117 103,121 105,125"/>
    <path class="ink" data-w="2.3" d="M99,111 C97,84 115,58 149,48 C190,38 238,54 258,90 C270,114 270,146 260,170"/>
  </g>

  <g id="face">
    <path class="ink" data-tone="brow" data-w="2.4" data-taper="0.15 0.55" d="M95,158.5 C103,156 111,156 120,157.5"/>
    <ellipse class="fill" data-tone="socket" cx="107" cy="168" rx="8" ry="5.5"/>
    <path class="fine" data-tone="deep" data-w="0.9" d="M84,192 C86,189.5 88.5,189.5 89.5,192.5"/>
