    <path class="ink" data-w="2.2" d="M100,109 C92,118 87,129 86,140 C85,149 86,157 88,164 C89,168 92,170 93,173 C90,177 86,182 83,187 C81,191 83,194 87,195 C90,196 92,197 92,199"/>
